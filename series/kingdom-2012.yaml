# Nombres con titulo opcional delante ("Lord Changwen", "señor Changwen", "Changwenjun")
mapear_regex:
  '(?:[Ll]ord |[Ss]eñor )?Changwen(?:jun)?': Shoubunkun
  '(?:[Ll]ord |[Ss]eñor )?Changping(?:jun)?': Shouheikun

# Nombres que significan cosas distintas segun la temporada: nunca se reemplazan globalmente
ambiguos:
  Xiang:
    '1': Shou        # Kyou Shou, la hermana de Kyoukai
    '2-6': Kou       # Kou, la concubina de Ei Sei
  Qing:
    '5': Kei         # el estandarte de Keisha

# Unidades cuyo nombre se conserva: "Hi Shin Force" / "Fuerza Hi Shin" -> "Unidad Hi Shin"
unidades: [Hi Shin, Gyoku Hou, Gaku Ka, Gaku, Tenbu, Nanshou, Yuuto]

# Reemplazos literales despues de todo lo anterior
