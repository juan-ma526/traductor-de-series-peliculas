# Perfil de ejemplo: Kingdom (anime, 2012).
# No confundir con "Kingdom" (2019, serie coreana de Netflix) ni con las peliculas live action japonesas.

serie: Kingdom
año: 2012
tipo: anime

idioma_destino: Latin American Spanish
codigo: es
tratamiento: tuteo

prompt: >
  Translate to natural Latin American Spanish.
  Keep character, military unit, city, and state names unchanged.

# Nombres que el traductor nunca debe tocar
nombres_fijos: [
  Shin, Ei Sei, Karyo Ten, Kyou Kai, Ouki, Mou Gou, Mou Bu, Tou, Duke Hyou, Ousen, Kanki, Riboku,
  Keisha, Karin, Kan Mei, Go Hou Mei, Ordo, Seikai, Shouheikun, Saitaku,
  Qin, Wei, Zhao, Chu, Yan, Han, Qi, Kankoku
]

# Los subtitulos en ingles de algunas temporadas usan la lectura china de los nombres.
